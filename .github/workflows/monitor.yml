name: SIH 2026 monitor

# Each run checks the site every 60s for ~5h45m. The cron re-triggers every 30 min;
# while a run is active the next one waits in the queue, so coverage is continuous.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      test_notify:
        description: "Just send a test notification"
        type: boolean
        default: false

concurrency:
  group: sih-monitor-${{ github.event.inputs.test_notify == 'true' && 'test' || 'watch' }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Configure git
        run: |
          git config user.name "sih-monitor-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Test notification
        if: ${{ github.event.inputs.test_notify == 'true' }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor.py --test-notify
      - name: Watch sih.gov.in
        if: ${{ github.event.inputs.test_notify != 'true' }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          COMMIT_STATE: "1"
        run: python monitor.py --loop-minutes 340 --interval 60
